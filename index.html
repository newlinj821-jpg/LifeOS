<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101321">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LifeOS">
  <meta name="description" content="LifeOS: your private command center for everyday life, plans, health, finances, habits and reminders.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" sizes="192x192" href="/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/simplicity.css">
  <link rel="stylesheet" href="/knowledge.css">
  <link rel="stylesheet" href="/mobile.css">
  <link rel="stylesheet" href="/app-mobile.css">
  <link rel="stylesheet" href="/calendar-share.css">
  <link rel="stylesheet" href="/finance.css">
  <link rel="stylesheet" href="/bank.css">
  <title>LifeOS — Your life, in focus.</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <button class="brand" type="button" data-nav="today"><span class="brand-mark"><img src="/icon.svg" alt="" width="39" height="39"></span><span><strong>LifeOS</strong><small>THE EVERYTHING APP</small></span></button>
      <div class="side-divider"></div>
      <div class="sidebar-scroll" id="sidebarNav"></div>
      <div class="sidebar-bottom">
        <div class="privacy-note"><span class="privacy-dot"></span><span>Local-first by design<br><small>You're in control of your data.</small></span></div>
        <button type="button" class="side-settings" data-nav="settings"><span>⚙</span><span>Settings & notifications</span><span>›</span></button>
      </div>
    </aside>
    <div class="shade" id="shade"></div>
    <div class="main-wrap">
      <header class="topbar">
        <div class="top-left"><button class="icon-btn mobile-menu" id="menuButton" type="button" aria-label="Open menu">☰</button><span class="breadcrumb"><b>MY SPACE</b><span class="crumb-slash">/</span><span id="breadcrumb">Overview</span></span></div>
        <div class="top-right">
          <span class="today-label" id="todayLabel"></span>
          <button class="icon-btn" id="searchButton" title="Search everything" aria-label="Search everything">⌕</button>
          <button class="icon-btn bell" id="bellButton" title="Reminders" aria-label="Reminders">♧<i id="bellDot"></i></button>
          <button class="primary-btn top-new" id="newButton">＋ Add new</button>
          <button class="avatar" id="avatarButton" title="Preferences">L</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1" aria-live="polite"></main>
      <footer class="footer">LIFEOS <span>·</span> ONE PLACE FOR EVERYTHING <span>·</span> PRIVATE BY DEFAULT</footer>
    </div>
  </div>
  <nav class="mobile-bottom" aria-label="Primary navigation">
    <button data-nav="today" class="mobile-tab active"><span>⌂</span><small>Today</small></button>
    <button data-nav="calendar" class="mobile-tab"><span aria-hidden="true">▦</span><small>Calendar</small></button>
    <button id="mobileAdd" class="mobile-add" aria-label="Add new">＋</button>
    <button data-nav="reminders" class="mobile-tab"><span>♧</span><small>Alerts</small></button>
    <button id="mobileMore" class="mobile-tab"><span>☷</span><small>More</small></button>
  </nav>
  <dialog id="entryDialog" class="dialog"><div id="entryDialogContent"></div></dialog>
  <dialog id="quickDialog" class="dialog slim"><div id="quickDialogContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script defer src="/app.js"></script>
  <script defer src="/enhancements.js"></script>
  <script defer src="/mode-core.js"></script>
  <script defer src="/simplicity.js"></script>
  <script defer src="/reference-db.js"></script>
  <script defer src="/knowledge-bridge.js"></script>
  <script defer src="/install.js"></script>
  <script defer src="/calendar-share.js"></script>
  <script defer src="/finance-core.js"></script>
  <script defer src="/finance-ui.js"></script>
  <script defer src="/bank-ui.js"></script>
  <script defer src="/input-reliability.js"></script>
  <script type="module" src="/knowledge-ui.mjs"></script>
</body>
</html>
