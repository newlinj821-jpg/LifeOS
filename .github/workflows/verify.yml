name: Verify LifeOS
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check finance-core.js
          node --check finance-ui.js
          node --check enhancements.js
          node --check mode-core.js
          node --check simplicity.js
          node --check reference-db.js
          node --check knowledge-bridge.js
          node --check knowledge-core.mjs
          node --check knowledge-ui.mjs
          node --check netlify/functions/knowledge.mjs
          node --check calendar-share.js
          node --check calendar-core.mjs
          node --check install.js
          node --check netlify/lib/calendar.mjs
          node --check netlify/functions/calendar-share.mjs
          node --check scripts/generate-icons.mjs
          node --check sw.js
          node --check netlify/lib/core.mjs
          node --check netlify/lib/push-recovery.mjs
          node --check netlify/functions/push.mjs
          node --check bank-balances.js
          node --check bank-ui.js
          node --check input-reliability.js
          node --check scripts/browser-input-smoke.mjs
          node --check netlify/lib/bank-data.mjs
          node --check netlify/lib/bank-background.mjs
          node --check netlify/functions/plaid.mjs
          node --check netlify/functions/plaid-webhook.mjs
          node --check netlify/functions/check-banks.mjs
          node --check netlify/functions/check-reminders.mjs
          node --check calendar-share.js
          node --check calendar-core.mjs
          node --check install.js
          node --check scripts/generate-icons.mjs
          node --check netlify/lib/calendar.mjs
          node --check netlify/functions/calendar-share.mjs
      - name: Build production PWA and verify required files
        run: |
          npm run build
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/input-reliability.js
          test -f dist/finance-core.js
          test -f dist/finance-ui.js
          test -f dist/finance.css
          test -f dist/bank.css
          test -f dist/bank-balances.js
          test -f dist/bank-ui.js
          test -f dist/enhancements.js
          test -f dist/mode-core.js
          test -f dist/simplicity.js
          test -f dist/simplicity.css
          test -f dist/reference-db.js
          test -f dist/knowledge-bridge.js
          test -f dist/knowledge-core.mjs
          test -f dist/knowledge-ui.mjs
          test -f dist/knowledge.css
          test -f dist/mobile.css
          test -f dist/app-mobile.css
          test -f dist/calendar-share.css
          test -f dist/calendar-share.js
          test -f dist/calendar-core.mjs
          test -f dist/install.js
          test -f dist/icon-192.png
          test -f dist/icon-512.png
          test -f dist/icon-maskable-512.png
          test -f dist/apple-touch-icon.png
          test -f dist/sw.js
          test -f dist/calendar-share.js
          test -f dist/calendar-share.css
          test -f dist/calendar-core.mjs
          test -f dist/mobile.css
          test -f dist/app-mobile.css
          test -f dist/install.js
          test -f dist/icon-192.png
          test -f dist/icon-512.png
          test -f dist/icon-maskable-512.png
          test -f dist/apple-touch-icon.png
      - name: Test reminder logic and experience modes
        run: node --test tests/*.test.mjs
      - name: Simulate mobile typing and saving in a real browser
        run: node scripts/browser-input-smoke.mjs
