[build]
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."check-reminders"]
  schedule = "*/5 * * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Read-only, revocable calendar subscription URL for Apple Calendar and Google Calendar.
[[redirects]]
  from = "/calendar/:id.ics"
  to = "/.netlify/functions/calendar-share?id=:id"
  status = 200
  force = true

[[headers]]
  for = "/calendar/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
